name: Rebuild taxonomy datasets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate both taxonomy datasets
        run: |
          python scripts/refresh_data.py
          python scripts/refresh_discogs_data.py
          python scripts/compare_taxonomies.py
          python scripts/validate_data.py
      - name: Commit generated data
        run: |
          git config user.name "rym-atlas-bot"
          git config user.email "rym-atlas-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore: rebuild taxonomy datasets"
          git push